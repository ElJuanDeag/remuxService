<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Remux Service</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #181c27;
    --bg3: #1e2333;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --muted: #7a8099;
    --accent: #4f8ef7;
    --accent-dim: rgba(79,142,247,0.12);
    --green: #3ecf8e;
    --green-dim: rgba(62,207,142,0.12);
    --amber: #f5a623;
    --amber-dim: rgba(245,166,35,0.12);
    --red: #e55353;
    --red-dim: rgba(229,83,83,0.12);
    --purple: #a78bfa;
    --purple-dim: rgba(167,139,250,0.12);
    --radius: 10px;
    --radius-sm: 6px;
    --mono: 'JetBrains Mono', 'Fira Mono', 'Consolas', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* layout */
  .app { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .header i { font-size: 22px; color: var(--accent); }
  .header h1 { font-size: 18px; font-weight: 600; letter-spacing: -.3px; }
  .header .version { margin-left: auto; font-size: 12px; color: var(--muted); background: var(--bg3); border: 1px solid var(--border); padding: 2px 10px; border-radius: 20px; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat .val { font-size: 24px; font-weight: 600; color: var(--text); }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* two-col layout */
  .cols { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; margin-bottom: 16px; }

  /* card */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 14px; }

  /* form elements */
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 5px; }
  input[type=text], input[type=number], select {
    width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-size: 13px; padding: 7px 10px; outline: none; font-family: inherit;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus { border-color: var(--accent); }
  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button { display: none; }
  select option { background: var(--bg3); }
  input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; height: 4px; }
  .form-row { margin-bottom: 12px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .inline-row { display: flex; gap: 8px; align-items: center; }
  .inline-row input[type=number] { width: 70px; flex-shrink: 0; }
  .unit { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* folder list */
  .folder-list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; margin-bottom: 12px; }
  .folder-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .folder-item button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0; display: flex; align-items: center; }
  .folder-item button:hover { color: var(--red); }
  .add-row { display: flex; gap: 6px; }
  .add-row input { flex: 1; font-family: var(--mono); font-size: 12px; }

  /* buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--bg3); color: var(--text); font-family: inherit; transition: background .15s, border-color .15s; white-space: nowrap; }
  .btn:hover { background: var(--bg); border-color: var(--border2); }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #6fa3f9; border-color: #6fa3f9; }
  .btn-danger { border-color: var(--red-dim); color: var(--red); }
  .btn-danger:hover { background: var(--red-dim); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-icon { padding: 5px 8px; }
  .action-bar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  .action-bar .right { margin-left: auto; display: flex; gap: 8px; }

  /* table */
  .table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--bg2); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  thead th { padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); background: var(--bg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg3); }
  tbody tr.encoding { background: rgba(79,142,247,0.04); }
  tbody tr.done { opacity: .6; }
  td { padding: 10px 12px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.name { font-family: var(--mono); font-size: 12px; color: var(--text); }
  td.num { font-variant-numeric: tabular-nums; color: var(--muted); }
  td.num.high { color: var(--amber); font-weight: 500; }
  .empty-row td { text-align: center; color: var(--muted); padding: 40px; font-size: 13px; }

  /* progress bar */
  .prog-wrap { height: 6px; background: var(--border); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
  .prog-eta { font-size: 10px; color: var(--muted); margin-top: 3px; font-family: var(--mono); }

  /* badge */
  .badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
  .badge-queued  { background: var(--purple-dim); color: var(--purple); }
  .badge-encoding{ background: var(--accent-dim);  color: var(--accent); }
  .badge-done    { background: var(--green-dim);   color: var(--green); }
  .badge-error   { background: var(--red-dim);     color: var(--red); }
  .badge-skipped { background: var(--border);      color: var(--muted); }
  .badge-high    { background: var(--amber-dim);   color: var(--amber); }

  /* log */
  .log-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; max-height: 160px; overflow-y: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); line-height: 1.7; margin-top: 16px; }
  .log-wrap .info  { color: var(--muted); }
  .log-wrap .ok    { color: var(--green); }
  .log-wrap .warn  { color: var(--amber); }
  .log-wrap .err   { color: var(--red); }
  .log-wrap .prog  { color: var(--accent); }

  /* spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { animation: spin .8s linear infinite; display: inline-block; }

  /* CRF row */
  .crf-row { display: flex; align-items: center; gap: 10px; }
  .crf-row input[type=range] { flex: 1; }
  .crf-val { font-size: 13px; font-weight: 600; min-width: 24px; text-align: right; color: var(--text); }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <i class="ti ti-device-desktop-analytics"></i>
    <h1>Remux Service</h1>
    <span class="version">v1.0</span>
  </div>

  <!-- stats -->
  <div class="stats">
    <div class="stat"><div class="val" id="s-scanned">—</div><div class="lbl">Files scanned</div></div>
    <div class="stat"><div class="val" id="s-above">—</div><div class="lbl">Above threshold</div></div>
    <div class="stat"><div class="val" id="s-done">0</div><div class="lbl">Remuxed</div></div>
    <div class="stat"><div class="val" id="s-saved">0 GB</div><div class="lbl">Space saved</div></div>
  </div>

  <!-- config + table -->
  <div class="cols">

    <!-- left: config -->
    <div class="card">
      <div class="card-title">Scan config</div>

      <div class="form-row">
        <label>Folders</label>
        <div class="folder-list" id="folder-list"></div>
        <div class="add-row">
          <input type="text" id="folder-input" placeholder="/media/movies" />
          <button class="btn btn-sm" onclick="addFolder()"><i class="ti ti-plus"></i></button>
        </div>
      </div>

      <div class="form-row form-grid">
        <div>
          <label>Threshold</label>
          <div class="inline-row">
            <input type="number" id="opt-threshold" value="2" min="0.1" step="0.5" />
            <span class="unit">GB/hr</span>
          </div>
        </div>
        <div>
          <label>Scan depth</label>
          <select id="opt-depth">
            <option value="1">1 level</option>
            <option value="2" selected>2 levels</option>
            <option value="3">3 levels</option>
            <option value="99">Unlimited</option>
          </select>
        </div>
      </div>

      <div class="card-title" style="margin-top:16px">Encode options</div>

      <div class="form-row form-grid">
        <div>
          <label>Encoder</label>
          <select id="opt-encoder">
            <option value="auto">Auto (GPU → CPU)</option>
            <option value="nvidia">NVIDIA NVENC</option>
            <option value="cpu" selected>CPU (libx265)</option>
          </select>
        </div>
        <div>
          <label>Output naming</label>
          <select id="opt-naming">
            <option value="replace" selected>Replace original</option>
            <option value="suffix">Add .remux suffix</option>
            <option value="subdir">Save in /remux dir</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <label>Parallel workers — <span id="workers-label">1</span> (sequential)</label>
        <div class="crf-row">
          <span style="font-size:11px;color:var(--muted)">1</span>
          <input type="range" id="opt-workers" min="1" max="4" value="1" step="1"
                 oninput="updateWorkersLabel(this.value)"/>
          <span style="font-size:11px;color:var(--muted)">4</span>
          <span class="crf-val" id="workers-val">1</span>
        </div>
      </div>

      <div class="form-row">
        <label>CRF quality — lower = better (<span id="crf-label">23</span>)</label>
        <div class="crf-row">
          <span style="font-size:11px;color:var(--muted)">18</span>
          <input type="range" id="opt-crf" min="18" max="32" value="23" step="1"
                 oninput="document.getElementById('crf-label').textContent=this.value;document.getElementById('crf-val').textContent=this.value"/>
          <span style="font-size:11px;color:var(--muted)">32</span>
          <span class="crf-val" id="crf-val">23</span>
        </div>
      </div>

      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px" onclick="runScan()" id="btn-scan">
        <i class="ti ti-scan"></i> Scan folders
      </button>
    </div>

    <!-- right: file table -->
    <div>
      <div class="action-bar">
        <span style="font-size:12px;color:var(--muted)" id="table-label">No scan yet</span>
        <div class="right">
          <button class="btn btn-sm" onclick="queueAll()" id="btn-queue-all" disabled>
            <i class="ti ti-list-check"></i> Queue all
          </button>
          <button class="btn btn-sm btn-primary" onclick="startEncode()" id="btn-start" disabled>
            <i class="ti ti-player-play"></i> Start encoding
          </button>
          <button class="btn btn-sm btn-danger" onclick="cancelEncode()" id="btn-cancel" disabled>
            <i class="ti ti-player-stop"></i> Cancel
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:32%">File</th>
              <th style="width:10%">Size</th>
              <th style="width:13%">Bitrate</th>
              <th style="width:9%">Duration</th>
              <th style="width:9%">Codec</th>
              <th style="width:14%">Status</th>
              <th style="width:13%"></th>
            </tr>
          </thead>
          <tbody id="file-tbody">
            <tr class="empty-row"><td colspan="7">Run a scan to find files above the threshold</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- log -->
  <div class="log-wrap" id="log-panel">
    <span class="info">[ready] Add folders and scan.</span>
  </div>
</div>

<script>
// ── state ────────────────────────────────────────────────────────────────────
let folders = ["/media/movies"];
let files = [];          // VideoFile dicts from /scan
let statuses = {};       // path → {status, percent, saved_gb}
let eventSource = null;
let totalSaved = 0;
let doneCount = 0;

// ── folder UI ────────────────────────────────────────────────────────────────
function renderFolders() {
  document.getElementById("folder-list").innerHTML = folders.map((f, i) => `
    <div class="folder-item">
      <span>${f}</span>
      <button onclick="removeFolder(${i})" title="Remove"><i class="ti ti-x" style="font-size:13px"></i></button>
    </div>`).join("") || '<span style="font-size:11px;color:var(--muted)">No folders added</span>';
}

function addFolder() {
  const inp = document.getElementById("folder-input");
  const v = inp.value.trim();
  if (!v || folders.includes(v)) return;
  folders.push(v);
  inp.value = "";
  renderFolders();
  log(`Added folder: ${v}`, "info");
}

function removeFolder(i) {
  log(`Removed folder: ${folders[i]}`, "warn");
  folders.splice(i, 1);
  renderFolders();
}

document.getElementById("folder-input").addEventListener("keydown", e => {
  if (e.key === "Enter") addFolder();
});

// ── scan ─────────────────────────────────────────────────────────────────────
async function runScan() {
  if (!folders.length) { log("No folders added.", "warn"); return; }
  const btn = document.getElementById("btn-scan");
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader spinning"></i> Scanning…';
  log(`Scanning ${folders.length} folder(s)…`, "info");

  try {
    const res = await fetch("/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        folders,
        threshold_gb_hr: parseFloat(document.getElementById("opt-threshold").value) || 2,
        depth: parseInt(document.getElementById("opt-depth").value) || 2,
      }),
    });
    const data = await res.json();
    files = data.files || [];
    statuses = {};
    files.forEach(f => statuses[f.path] = { status: "queued", percent: 0, saved_gb: null });

    doneCount = 0;
    totalSaved = 0;

    document.getElementById("s-scanned").textContent = files.length;
    document.getElementById("s-above").textContent = files.length;
    document.getElementById("s-done").textContent = 0;
    document.getElementById("s-saved").textContent = "0 GB";
    document.getElementById("table-label").textContent = `${files.length} file(s) above threshold`;

    renderTable();
    document.getElementById("btn-queue-all").disabled = files.length === 0;
    document.getElementById("btn-start").disabled = files.length === 0;
    log(`Scan complete — ${files.length} file(s) above threshold.`, files.length ? "ok" : "info");
  } catch (e) {
    log(`Scan failed: ${e.message}`, "err");
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-scan"></i> Scan folders';
}

// ── table ────────────────────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById("file-tbody");
  if (!files.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="7">No files found above threshold</td></tr>';
    return;
  }

  tbody.innerHTML = files.map(f => {
    const st = statuses[f.path] || { status: "queued", percent: 0 };
    const rowCls = st.status === "encoding" ? "encoding" : st.status === "done" ? "done" : "";
    const badgeCls = `badge-${st.status}`;
    const badgeLabel = st.status === "encoding"
      ? `${st.percent}%`
      : st.status === "done" ? (st.saved_gb != null ? `−${st.saved_gb} GB` : "done")
      : st.status;

    const prog = st.status === "encoding"
      ? `<div class="prog-wrap"><div class="prog-fill" id="prog-${CSS.escape(f.path)}" style="width:${st.percent}%"></div></div><div class="prog-eta" id="eta-${CSS.escape(f.path)}">${st.eta || ""}</div>`
      : "";

    const skipBtn = (st.status === "queued")
      ? `<button class="btn btn-sm btn-icon" onclick="skipFile('${escAttr(f.path)}')" title="Skip"><i class="ti ti-minus"></i></button>`
      : "";

    return `<tr class="${rowCls}" id="row-${rowId(f.path)}">
      <td class="name" title="${escAttr(f.name)}">${esc(shortName(f.name))}</td>
      <td class="num">${f.size_gb} GB</td>
      <td class="num high">${f.bitrate_gb_per_hour} GB/hr</td>
      <td class="num">${Math.round(f.duration_minutes)}m</td>
      <td class="num">${f.video_codec}</td>
      <td><span class="badge ${badgeCls}">${badgeLabel}</span>${prog}</td>
      <td style="text-align:right">${skipBtn}</td>
    </tr>`;
  }).join("");
}

function rowId(path) { return btoa(path).replace(/[^a-zA-Z0-9]/g, "_"); }
function shortName(n) { return n.length > 34 ? n.slice(0, 31) + "…" : n; }
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s) { return s.replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

async function skipFile(path) {
  await fetch(`/queue/${path.replace(/^\//,"")}`, { method: "DELETE" });
  statuses[path] = { status: "skipped", percent: 0, saved_gb: null };
  renderTable();
  log(`Skipped: ${path.split("/").pop()}`, "warn");
}

async function queueAll() {
  const paths = files.filter(f => statuses[f.path]?.status === "skipped").map(f => f.path);
  if (!paths.length) return;
  await fetch("/queue/add", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ paths }),
  });
  paths.forEach(p => statuses[p] = { status: "queued", percent: 0, saved_gb: null });
  renderTable();
  log(`Re-queued ${paths.length} file(s).`, "info");
}

function updateWorkersLabel(v) {
  document.getElementById("workers-label").textContent = v == 1 ? "1 (sequential)" : v;
  document.getElementById("workers-val").textContent = v;
}

function fmtEta(secs) {
  if (secs == null || secs < 0) return "";
  if (secs < 60) return `ETA ${secs}s`;
  const m = Math.floor(secs / 60), s = secs % 60;
  return `ETA ${m}m ${s}s`;
}

// ── encode ───────────────────────────────────────────────────────────────────
function startEncode() {
  if (eventSource) return;

  const crf = document.getElementById("opt-crf").value;
  const encoder = document.getElementById("opt-encoder").value;
  const naming = document.getElementById("opt-naming").value;
  const workers = document.getElementById("opt-workers").value;

  const url = `/encode/stream?crf=${crf}&encoder=${encoder}&naming=${naming}&workers=${workers}`;
  eventSource = new EventSource(url);

  document.getElementById("btn-start").disabled = true;
  document.getElementById("btn-cancel").disabled = false;
  document.getElementById("btn-scan").disabled = true;
  log(`Starting encode — encoder=${encoder}  crf=${crf}  naming=${naming}  workers=${workers}`, "info");

  eventSource.onmessage = e => {
    const ev = JSON.parse(e.data);

    if (ev.type === "progress") {
      if (!statuses[ev.path]) statuses[ev.path] = {};
      statuses[ev.path].status = "encoding";
      statuses[ev.path].percent = ev.percent;
      statuses[ev.path].eta = fmtEta(ev.eta_seconds);
      // fast path: only update the fill bar and badge, not full table
      const fill = document.getElementById(`prog-${CSS.escape(ev.path)}`);
      if (fill) {
        fill.style.width = ev.percent + "%";
        const etaEl = document.getElementById(`eta-${CSS.escape(ev.path)}`);
        if (etaEl) etaEl.textContent = statuses[ev.path].eta + (ev.fps ? `  ${ev.fps} fps` : "");
        const row = document.getElementById(`row-${rowId(ev.path)}`);
        if (row) {
          const badge = row.querySelector(".badge");
          if (badge) { badge.className = "badge badge-encoding"; badge.textContent = ev.percent + "%"; }
        }
      } else {
        renderTable();
      }
    }

    else if (ev.type === "file_done") {
      if (!statuses[ev.path]) statuses[ev.path] = {};
      statuses[ev.path].status = "done";
      statuses[ev.path].percent = 100;
      statuses[ev.path].saved_gb = ev.saved_gb;
      doneCount++;
      totalSaved += ev.saved_gb || 0;
      document.getElementById("s-done").textContent = doneCount;
      document.getElementById("s-saved").textContent = totalSaved.toFixed(2) + " GB";
      renderTable();
      log(`Done: ${ev.name} — saved ${ev.saved_gb} GB (${ev.ratio}% smaller)`, "ok");
    }

    else if (ev.type === "error") {
      if (!statuses[ev.path]) statuses[ev.path] = {};
      statuses[ev.path].status = "error";
      renderTable();
      log(`Error: ${ev.name || ev.path} — ${ev.message}`, "err");
    }

    else if (ev.type === "queue_done") {
      eventSource.close();
      eventSource = null;
      document.getElementById("btn-start").disabled = false;
      document.getElementById("btn-cancel").disabled = true;
      document.getElementById("btn-scan").disabled = false;
      log(`Queue complete. Total saved: ${ev.total_saved_gb} GB`, "ok");
    }
  };

  eventSource.onerror = () => {
    if (eventSource) { eventSource.close(); eventSource = null; }
    document.getElementById("btn-start").disabled = false;
    document.getElementById("btn-cancel").disabled = true;
    document.getElementById("btn-scan").disabled = false;
    log("SSE connection closed.", "warn");
  };
}

async function cancelEncode() {
  await fetch("/encode/cancel", { method: "POST" });
  if (eventSource) { eventSource.close(); eventSource = null; }
  document.getElementById("btn-start").disabled = false;
  document.getElementById("btn-cancel").disabled = true;
  document.getElementById("btn-scan").disabled = false;
  log("Encode cancelled.", "warn");
}

// ── log ───────────────────────────────────────────────────────────────────────
function log(msg, type = "info") {
  const panel = document.getElementById("log-panel");
  const t = new Date().toLocaleTimeString("en-GB", { hour12: false });
  const span = document.createElement("span");
  span.className = type;
  span.textContent = `\n[${t}] ${msg}`;
  panel.appendChild(span);
  panel.scrollTop = panel.scrollHeight;
}

// ── init ─────────────────────────────────────────────────────────────────────
async function restoreState() {
  try {
    const [qRes, sRes] = await Promise.all([fetch("/queue"), fetch("/status")]);
    const qData = await qRes.json();
    const sData = await sRes.json();

    if (!qData.queue || !qData.queue.length) return;

    files = qData.queue.map(f => ({
      path: f.path, name: f.name, size_gb: f.size_gb,
      bitrate_gb_per_hour: f.bitrate_gb_per_hour,
      duration_minutes: f.duration_minutes, video_codec: f.video_codec,
    }));
    statuses = {};
    let done = 0, saved = 0;
    qData.queue.forEach(f => {
      statuses[f.path] = { status: f.status || "queued", percent: f.percent || 0, saved_gb: f.saved_gb || null };
      if (f.status === "done") { done++; saved += f.saved_gb || 0; }
    });
    doneCount = done;
    totalSaved = saved;

    document.getElementById("s-scanned").textContent = files.length;
    document.getElementById("s-above").textContent = files.length;
    document.getElementById("s-done").textContent = done;
    document.getElementById("s-saved").textContent = saved.toFixed(2) + " GB";
    document.getElementById("table-label").textContent = files.length + " file(s) above threshold";
    document.getElementById("btn-queue-all").disabled = false;
    document.getElementById("btn-start").disabled = false;
    renderTable();
    log("Restored previous session state.", "info");

    if (sData.encoding) {
      log("Encode in progress — reconnecting...", "warn");
      const crf = document.getElementById("opt-crf").value;
      const encoder = document.getElementById("opt-encoder").value;
      const naming = document.getElementById("opt-naming").value;
      const workers = document.getElementById("opt-workers").value;
      eventSource = new EventSource("/progress/stream");
      document.getElementById("btn-start").disabled = true;
      document.getElementById("btn-cancel").disabled = false;
      document.getElementById("btn-scan").disabled = true;
      eventSource.onmessage = e => {
        const ev = JSON.parse(e.data);
        if (ev.type === "progress") {
          if (!statuses[ev.path]) statuses[ev.path] = {};
          statuses[ev.path].status = "encoding";
          statuses[ev.path].percent = ev.percent;
          statuses[ev.path].eta = fmtEta(ev.eta_seconds);
          const fill = document.getElementById("prog-" + CSS.escape(ev.path));
          if (fill) {
            fill.style.width = ev.percent + "%";
            const etaEl = document.getElementById("eta-" + CSS.escape(ev.path));
            if (etaEl) etaEl.textContent = statuses[ev.path].eta + (ev.fps ? "  " + ev.fps + " fps" : "");
            const row = document.getElementById("row-" + rowId(ev.path));
            if (row) { const badge = row.querySelector(".badge"); if (badge) { badge.className = "badge badge-encoding"; badge.textContent = ev.percent + "%"; } }
          } else { renderTable(); }
        } else if (ev.type === "file_done") {
          statuses[ev.path] = { status: "done", percent: 100, saved_gb: ev.saved_gb };
          doneCount++; totalSaved += ev.saved_gb || 0;
          document.getElementById("s-done").textContent = doneCount;
          document.getElementById("s-saved").textContent = totalSaved.toFixed(2) + " GB";
          renderTable();
          log("Done: " + ev.name + " — saved " + ev.saved_gb + " GB (" + ev.ratio + "% smaller)", "ok");
        } else if (ev.type === "error") {
          statuses[ev.path] = { status: "error", percent: 0 };
          renderTable();
          log("Error: " + (ev.name || ev.path) + " — " + ev.message, "err");
        } else if (ev.type === "queue_done") {
          eventSource.close(); eventSource = null;
          document.getElementById("btn-start").disabled = false;
          document.getElementById("btn-cancel").disabled = true;
          document.getElementById("btn-scan").disabled = false;
          log("Queue complete. Total saved: " + ev.total_saved_gb + " GB", "ok");
        }
      };
      eventSource.onerror = () => {
        if (eventSource) { eventSource.close(); eventSource = null; }
        document.getElementById("btn-start").disabled = false;
        document.getElementById("btn-cancel").disabled = true;
        document.getElementById("btn-scan").disabled = false;
        log("SSE connection closed.", "warn");
      };
    }
  } catch(e) {
    log("State restore failed: " + e.message, "warn");
  }
}

renderFolders();
restoreState();
</script>
